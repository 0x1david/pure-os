[package]
name = "pure-os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.34", features = ["map_physical_memory"] }
spin = "0.10.0"
lock_api = "=0.4.10"
x86_64 = "0.15.4"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"

[dependencies.lazy_static]
version = "1.5.0"
features = ["spin_no_std"]

[[bin]]
name = "pure-os"
test = true
bench = false

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
